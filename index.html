<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Bürgerkonto 2030 — citizen account demo with a guided assistant and government agents (synthetic data).">
<title>Bürgerkonto 2030</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@500;600&display=swap">
<style>
/* Layout: left card is the main screen (overview → category page → procedure flow); right rail is the assistant that watches the screen */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --fg:#15171C; --muted:#5B6270; --border:#DCDFE6;
  --accent:#A3122B; --accent-soft:#FBE8EC; --accent-fg:#7A0D20;
  --ok:#1F7A4D; --ok-soft:#E3F3EA; --warn:#9A5A00; --warn-soft:#FBEFD9; --crit:#B3122E; --crit-soft:#FBE4E7;
  --font-display:"Instrument Sans","IBM Plex Sans",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --fs:15px; --radius:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111317; --surface:#1A1D23; --surface-2:#20242B; --fg:#ECEEF1; --muted:#9AA3B0; --border:#2C313A;
  --accent:#E8647B; --accent-soft:#3A1C24; --accent-fg:#F5B3BF;
  --ok:#5BC48A; --ok-soft:#173327; --warn:#E3A33A; --warn-soft:#3A2B10; --crit:#F0665A; --crit-soft:#3E1C1A;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1A1D23; --surface-2:#20242B; --fg:#ECEEF1; --muted:#9AA3B0; --border:#2C313A;
  --accent:#E8647B; --accent-soft:#3A1C24; --accent-fg:#F5B3BF;
  --ok:#5BC48A; --ok-soft:#173327; --warn:#E3A33A; --warn-soft:#3A2B10; --crit:#F0665A; --crit-soft:#3E1C1A;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:var(--fs);line-height:1.5;
  padding-block:0 32px;padding-left:max(clamp(16px,2.5vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,2.5vw,40px),env(safe-area-inset-right,0px))}
@media (min-width:1600px){:root{--fs:16px}}
body.simple{--fs:19px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--border);margin-bottom:20px;max-width:1520px;margin-inline:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:1.1em;letter-spacing:-.01em}
.brand .flag{width:22px;height:15px;border-radius:2px;background:linear-gradient(var(--accent) 33.3%,#fff 33.3% 66.6%,var(--accent) 66.6%);border:1px solid var(--border)}
.brand small{font-family:var(--font-body);font-weight:400;color:var(--muted);font-size:.78em;letter-spacing:.06em;text-transform:uppercase}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.92em}
.ctl select{border:0;background:transparent;padding:0;font-weight:500}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:.92em;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.92em;font-weight:500}
.toggle .knob{width:30px;height:18px;border-radius:999px;background:var(--border);position:relative;transition:background .15s}
.toggle .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.toggle[aria-pressed="true"] .knob{background:var(--ok)}
.toggle[aria-pressed="true"] .knob::after{transform:translateX(12px)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) clamp(400px,37%,560px);gap:clamp(20px,2vw,32px);align-items:start;max-width:1520px;margin-inline:auto}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.assistant{order:-1}}
body.simple .layout{grid-template-columns:minmax(0,1fr);max-width:760px;margin:0 auto}
body.simple .assistant{order:-1}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px}
.screen{padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;min-width:0}
@media (min-width:1400px){.screen{padding:28px 32px}}
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.88em;color:var(--muted)}
.crumb button{border:0;background:transparent;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.crumb button:hover{color:var(--fg)}
.crumb b{color:var(--fg);font-weight:500}
.resume{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;background:var(--surface-2);font-size:.92em}
.resume button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:500;font-size:.92em}

.identity{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:1.4em}
.who h1{margin:0;font-family:var(--font-display);font-weight:600;font-size:1.55em;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
.who .sub{color:var(--muted);margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.82em;font-weight:500;border:1px solid var(--border);background:var(--surface-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.pend{background:var(--accent-soft);color:var(--accent-fg);border-color:transparent}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

.section h2{margin:0 0 10px;font-family:var(--font-display);font-weight:600;font-size:.82em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.section h2 .open{border:0;background:transparent;color:var(--accent);font:inherit;letter-spacing:0;text-transform:none;font-size:1.05em;font-weight:500;padding:0}
.section h2 .open:hover{text-decoration:underline;text-underline-offset:3px}
.cat{border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:grid;gap:10px;min-width:0;cursor:pointer;transition:border-color .12s}
.cat:hover{border-color:var(--fg)}
.cat:focus-visible{outline-offset:0}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;align-items:start}
.cs{font-size:.9em;color:var(--muted);line-height:1.5}
.cs .num{font-family:var(--font-mono);font-size:.92em}
.nudges{display:grid;gap:8px}
.nudge{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:10px 12px 10px 0;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);overflow:hidden}
.nudge .stripe{height:100%;background:var(--muted)}
.nudge.warn .stripe{background:var(--warn)}
.nudge.crit .stripe{background:var(--crit)}
.nudge .t{font-weight:500}
.nudge .b{color:var(--muted);font-size:.92em}
.nudge button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88em;font-weight:500;white-space:nowrap}
.nudge button:hover{border-color:var(--fg)}
@media (max-width:600px){.nudge{grid-template-columns:4px 1fr}.nudge button{grid-column:2;justify-self:start}}
.empty{color:var(--muted);font-size:.92em;padding:4px 0}

.doc{display:grid;gap:4px;min-width:0}
.doc .name{font-weight:500;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.doc .num{font-family:var(--font-mono);font-size:.85em;color:var(--muted);letter-spacing:.02em}
.doc .meta{font-size:.88em;color:var(--muted)}
.doc .meta b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:minmax(110px,38%) minmax(0,1fr);gap:6px 16px;font-size:.95em;margin:0}
.kv dt{color:var(--muted);margin:0}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv dd.mono{font-family:var(--font-mono);font-size:.9em}
.people{display:grid;gap:6px}
.person{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);flex-wrap:wrap}
.person span{color:var(--muted);font-size:.92em}

.pagehead h1{margin:0;font-family:var(--font-display);font-weight:600;font-size:1.5em;letter-spacing:-.015em;text-wrap:balance}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.actgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.act{border:1px solid var(--border);border-radius:12px;padding:12px 14px;text-align:left;background:var(--surface);display:grid;gap:4px;transition:border-color .12s}
.act:hover{border-color:var(--fg)}
.act .t{font-weight:500}
.act .d{font-size:.86em;color:var(--muted)}
.requests{display:grid;gap:8px}
.req{display:grid;gap:4px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2)}
.req .t{font-weight:500;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.req .t code{font-family:var(--font-mono);font-size:.85em;color:var(--muted)}
.req .b{font-size:.9em;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.req .b button{border:0;background:transparent;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:1em}

.progress{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:.82em;color:var(--muted)}
.pill .n{width:18px;height:18px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:.8em;font-variant-numeric:tabular-nums}
.pill.cur{border-color:var(--fg);color:var(--fg);font-weight:500}
.pill.cur .n{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill.done{color:var(--ok)}
.pill.done .n{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.step{border:1px solid var(--border);border-radius:14px;overflow:hidden}
.step .sh{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.step .sh h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:1.1em;letter-spacing:0;text-transform:none;color:var(--fg)}
.step .sh p{margin:2px 0 0;color:var(--muted);font-size:.92em}
.tag{font-size:.76em;font-weight:500;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.have{background:var(--ok-soft);color:var(--ok)}
.tag.need{background:var(--warn-soft);color:var(--warn)}
.tag.you{background:var(--accent-soft);color:var(--accent-fg)}
.tag.page{background:var(--surface-2);color:var(--muted);border:1px solid var(--border);cursor:pointer}
.tag.page:hover{color:var(--fg)}
.sb{padding:16px;display:grid;gap:14px}
.fields{display:grid;gap:10px}
.fields label{display:grid;gap:4px;font-size:.92em;font-weight:500}
.fields input,.fields select{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:9px 10px;font-weight:400;max-width:100%}
.fields input[type=file]{padding:6px}
.fields .pre{font-size:.8em;color:var(--ok);font-weight:400}
.sf{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface-2)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500;font-size:.92em}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.link{border:0;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px 4px}
.btn:hover{filter:brightness(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95em}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.err{color:var(--crit);font-size:.85em}
.note{font-size:.88em;color:var(--muted);border-left:2px solid var(--border);padding-left:10px}
.sum{display:grid;gap:4px;font-size:.92em}
.sum div{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:12px}
.sum span{color:var(--muted)}
.receipt{text-align:center;display:grid;gap:8px;padding:10px 0}
.receipt .ok-ring{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto;font-size:1.6em}
.receipt h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:1.3em}
.receipt code{font-family:var(--font-mono);font-size:1.05em}
.receipt p{margin:0;color:var(--muted)}

.assistant{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);overflow:hidden;min-height:0}
@media (min-width:901px){
 body:not(.simple){height:100vh;height:100dvh;display:flex;flex-direction:column;padding-bottom:16px;overflow:hidden}
 body:not(.simple) .top{flex:none;width:100%}
 body:not(.simple) .layout{flex:1;min-height:0;width:100%;grid-template-rows:minmax(0,1fr);align-items:stretch}
 body:not(.simple) .screen{min-height:0;overflow:auto;align-content:start;overscroll-behavior:contain}
 body:not(.simple) .thread:empty{display:grid;place-content:center;text-align:center;color:var(--muted);padding:24px}
 body:not(.simple) .thread:empty::before{content:attr(data-empty);max-width:34ch;font-size:.95em;line-height:1.5}
}
.ahead{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ahead h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:1.05em;align-self:center}
.ahead p{margin:2px 0 0;color:var(--muted);font-size:.86em}
.handoff{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.86em;font-weight:500;white-space:nowrap}
.handoff:hover{border-color:var(--fg)}
.ctx{display:flex;align-items:center;gap:8px;padding:8px 18px;background:var(--accent-soft);color:var(--accent-fg);font-size:.86em;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ctx .eye{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.ctx button{border:0;background:transparent;color:inherit;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:1em}
.ask{padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;background:var(--surface-2)}
.ask label{font-weight:500}
.askrow{display:flex;gap:8px}
.askrow input{flex:1;width:0;min-width:0;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:11px 12px}
.askrow input::placeholder{color:var(--muted)}
.ibtn{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);width:44px;display:grid;place-items:center;flex:none}
.ibtn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.ibtn.rec{border-color:var(--crit);color:var(--crit);animation:pulse 1.2s ease-in-out infinite}
.ibtn.off{color:var(--muted);opacity:.55}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--crit-soft)}50%{box-shadow:0 0 0 7px var(--crit-soft)}}
.voice{display:flex;align-items:center;gap:8px;font-size:.86em;color:var(--crit)}
.voice i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.2s ease-in-out infinite}
.ibtn svg{width:20px;height:20px}
.starters{display:flex;gap:6px;flex-wrap:wrap}
.starters button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.84em}
.starters button:hover{border-color:var(--fg)}
.hint{font-size:.82em;color:var(--muted)}
.thread{padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-height:0;overflow:auto;border-bottom:1px solid var(--border);overscroll-behavior:contain}
.thread:empty{display:none}
.you{justify-self:end;max-width:85%;background:var(--fg);color:var(--bg);padding:9px 13px;border-radius:14px 14px 4px 14px}
.msg{display:grid;gap:10px}
.msg .lead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.msg .lead p{margin:0}
.readaloud{border:0;background:transparent;color:var(--muted);font-size:.82em;padding:0;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.case{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.case .ch{padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.86em;color:var(--muted)}
.case .ch b{color:var(--fg);font-weight:500}
.pr{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)}
.pr:last-child{border-bottom:0}
.pr .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:.78em;font-variant-numeric:tabular-nums}
.pr .s{font-weight:500}
.pr .d{font-size:.84em;color:var(--muted)}
.btn.sm{padding:5px 11px;font-size:.86em}
.case details{border-bottom:1px solid var(--border)}
.case details:last-child{border-bottom:0}
.case summary{cursor:pointer;padding:7px 12px 7px 46px;font-size:.84em;color:var(--muted);list-style:none}
.case summary::-webkit-details-marker{display:none}
.case summary::before{content:"▸ ";font-size:.9em}
.case details[open] summary::before{content:"▾ "}
.mini{list-style:none;margin:0;padding:0 12px 10px 46px;display:grid;gap:4px}
.mini li{display:flex;justify-content:space-between;gap:10px;font-size:.9em;cursor:pointer}
.mini li:hover .s{text-decoration:underline;text-underline-offset:3px}
.mini li span:last-child{color:var(--muted);font-size:.86em;white-space:nowrap}
.mini li .s{flex:1;min-width:0}
.case .srcs{padding:0 12px 10px 46px}
.foot{display:flex;gap:10px;flex-wrap:wrap;font-size:.82em;color:var(--muted)}
.foot button{border:0;background:transparent;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:1em}
.foot button:hover{color:var(--fg)}
.iconbtn{border:1px solid var(--border);background:var(--surface);border-radius:999px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{color:var(--fg);border-color:var(--fg)}
.iconbtn svg{width:16px;height:16px}
.plan{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.plan .ph{padding:10px 12px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.plan .ph b{font-weight:500}
.conf{font-size:.8em;color:var(--muted)}
.conf i{display:inline-block;width:36px;height:6px;border-radius:3px;background:var(--border);vertical-align:middle;margin-left:6px;position:relative;overflow:hidden}
.conf i::after{content:"";position:absolute;inset:0;width:var(--w,50%);background:var(--ok)}
.conf.low i::after{background:var(--warn)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:9px 12px;border-bottom:1px solid var(--border)}
.steps li:last-child{border-bottom:0}

function nudgesFor(p){
 const out=[];
 if(!p.residence.registered){const dl=new Date(new Date(p.residence.since).getTime()+3*DAY);out.push({lvl:"crit",t:t("n_reg"),b:t("n_reg_b",{date:fmt(dl)+" ("+rel(dl)+")"}),proc:"res_register"})}
 if(!p.ida&&!p.idaPending)out.push({lvl:"crit",t:t("n_ida"),b:t("n_ida_b"),proc:"ida_activate"});
 if(p.passport){const n=days(p.passport.valid);if(n<0)out.push({lvl:"crit",t:t("n_pass_exp"),b:t("n_pass_exp_b",{d:rel(p.passport.valid)}),proc:"passport_renew"});else if(n<180)out.push({lvl:"warn",t:t("n_pass_soon"),b:t("n_pass_soon_b",{date:fmt(p.passport.valid)}),proc:"passport_renew"})}
 for(const m of p.household){const b=new Date(m.born);const third=new Date(b.getFullYear()+3,b.getMonth(),b.getDate());const n=days(third);if(n>=0&&n<120)out.push({lvl:"warn",t:t("n_child",{name:m.name.split(" ")[0],d:rel(third)}),b:t("n_child_b"),proc:"child_care"})}
 if(!p.ecard&&!p.ecardPending)out.push({lvl:"warn",t:t("n_ecard"),b:t("n_ecard_b"),proc:"ins_register"});
 if(p.licence&&!p.licence.card)out.push({lvl:"info",t:t("n_lic"),b:t("n_lic_b"),proc:"lic_exchange"});
 return out;
}

function go(s){screen=s;render()}
function crumb(parts){return`<nav class="crumb">${parts.map((x,i)=>i<parts.length-1?`<button data-crumb="${i}">${x.l}</button><span>›</span>`:`<b>${x.l}</b>`).join("")}</nav>`}
function resumeBar(){if(cb&&screen.type!=="case"&&!cb.complete){const c=caseCounts();const bits=[c.working?t("n_working",{n:c.working}):"",c.open?t("n_open",{n:c.open}):"",(c.inquiry||0)+(c.decision||0)?t("n_needs",{n:(c.inquiry||0)+(c.decision||0)}):""].filter(Boolean).join(" · ");return`<div class="resume"><span><span class="caseid">${cb.file.id}</span> <b>${caseTitle()}</b> · ${t("prog_line",{k:doneCount(),n:visibleIds().length})}${bits?" · "+bits:""}</span><button data-case>${t("opencase")}</button></div>`}return""}

 el.innerHTML=screen.type==="overview"?renderOverview():screen.type==="page"?renderPage():renderCase();

 updateCard();
 el.querySelectorAll("[data-page]").forEach(b=>{b.onclick=()=>go({type:"page",page:b.dataset.page});b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();b.click()}}});

function genericPlay(id){const pr=PROCS[id];const steps=[];if(pr.onBehalf)steps.push(ST.consent());
 for(const st of pr.steps){const before=steps.length;
  if(st.k==="review"){const iface=PAGE_IFACE[st.page]||"ZPR";steps.push(ST.lookup(iface,st.l,pr.l,()=>{const got=st.fields.filter(k=>F[k].g(profile));return{out:t("x_retrieved")+": "+got.map(k=>L(F[k].l)+" = "+F[k].g(profile)).join(" · ")}}))}
  else if(st.k==="input")steps.push(ST.ask(st.fields,st.l));
  else if(st.k==="external")steps.push(st.party?ST.request(L(st.party),st.l,pr.l,()=>{const o=t("party_confirmed",{p:L(st.party)});return{out:o[0].toUpperCase()+o.slice(1)+(L(st.d)?" · "+L(st.d):"")}}):ST.schedule(st.l,st.d));
  else if(st.k==="lookup")steps.push(st.party?ST.request(L(st.party),st.l,pr.l,()=>({out:L(st.d)})):ST.lookup(st.iface&&IFACE[st.iface]?st.iface:(PAGE_IFACE[st.page]||"ZPR"),st.l,pr.l,()=>({out:L(st.d)})));
  else if(st.k==="inquiry")steps.push({type:"inquiry",l:st.l,to:st.to,q:st.q,run:a=>{const key="inq_"+a.id+"_"+L(st.l);const v=caseData[key];if(!v)return{inquiry:key};return{out:v==="sent"?t("inq_reply_note",{to:L(st.to)}):t("inq_skipped_note")}}});
  else if(st.k==="confirm")steps.push(ST.prepare(st.l,()=>{const fields=[];for(const s2 of pr.steps){if(s2.k==="review")for(const k of s2.fields){const v=F[k].g(profile);if(v)fields.push([L(F[k].l),v])}if(s2.k==="input")for(const fd of s2.fields){const v=val(fd);if(v)fields.push([L(fd.l),fd.t==="date"?fmt(v):v])}}return{out:t("x_prepared")+" → "+L(st.to),app:{to:L(st.to),fields,attachments:[],purpose:L(pr.l),fee:st.fee?L(st.fee):""}}}));
  else if(st.k==="info"&&L(st.d))steps.push(ST.note(st.l,st.d));
  for(const x of steps.slice(before)){x.page=st.page;if(st.src)x.src=st.src}
 }
 return steps}

const WAIT_MS=5000;   // a request to a third party (landlord, hospital, provider, employer, authority) waits this long for the simulated reply
function advance(id){

 if(k<0){finalize(a);return}
 const st=a.steps[k];a.cur=k;a.st="working";st.st="running";st.ts=now();a.inq=null;
 if(st.party&&!st.waited){st.waited=true;st.phase="wait";st.waitStart=Date.now();st.out="";logCase(id,t("ev_request",{p:st.party}));render();
  setTimeout(()=>{if(!cb||cb.agents[id]!==a||st.st!=="running")return;st.phase=null;runStep(id,a,st)},WAIT_MS);return}
 st.phase=null;render();

function runStep(id,a,st){let r;try{r=st.run(a)||{}}catch(e){r={out:String(e&&e.message||e)}}

  if(r.need){st.st="pending";a.st="open";a.err=t("required")+" — "+r.need.map(fd=>L(fd.l)).join(", ");render();return}
  if(r.inquiry){st.st="needs";a.st="inquiry";a.inq={key:r.inquiry,to:L(st.to),q:L(st.q)};st.out=t("inq_pending");logCase(id,t("inq_title",{to:L(st.to)}));sayOnce(a,"inq:"+k,t("say_inquiry",{a:esc(actorName(id)),to:esc(L(st.to))}));render();return}
  st.st="done";if(r.ext)a.external.push(r.ext);if(r.app)a.app=r.app;if(r.produce)cb.out[id]=Object.assign(cb.out[id]||{},r.produce);

}

// ---------- flow engine ----------
// a task started from a page opens as a section of the running case (or as a new case); the chat only explains
function runTask(id){
 if(!avail(id))return;
 if(cb&&!cb.complete){if(cb.ids.includes(id)){focusSection(id);return}addSection(id);go({type:"case"});return}
 startCase([id],null);
}
// explanations in the chat: a message, never a control
function settleChat(){document.querySelectorAll("#thread [data-opt],#thread [data-k],#thread [data-hand],#thread [data-lookup],#thread [data-go],#thread [data-run],#thread [data-inc],#thread [data-out]").forEach(b=>{if(!(cb&&cb.card&&cb.card.contains(b)))b.remove()});document.querySelectorAll("#thread .actions:empty,#thread .foot:empty").forEach(e=>e.remove())}

function detect(text){
 const s=text.toLowerCase();
 // 1. navigation
 if(NAV_VERBS.some(v=>s.includes(v))){for(const [k,pg] of Object.entries(PAGES))if(pg.kw.some(w=>s.includes(w)))return{nav:k}}
 // 2. explicit procedures (specific keywords), page-filtered when on a page
 let hits=Object.keys(PROCS).filter(id=>avail(id)&&PROCS[id].kw.some(w=>s.includes(w)));
 if(hits.length>1&&screen.type==="page"){const onPage=hits.filter(id=>PROCS[id].page===screen.page);if(onPage.length)hits=onPage}
 if(hits.includes("res_deregister"))hits=hits.filter(id=>id!=="address_change"&&id!=="res_register");
 // generic passport/child words map broadly; keep one per page
 const seen=new Set();hits=hits.filter(id=>{const k=PROCS[id].page+":"+PROCS[id].verb;if(seen.has(k))return false;seen.add(k);return true});
 for(const id of [...hits])for(const x of PROCS[id].bundle||[])if(avail(x)&&!hits.includes(x))hits.push(x);

 if(hits.length)return{procs:hits.sort((a,b)=>(PROCS[a].order??9)-(PROCS[b].order??9)).slice(0,6)};
 // 3. vague verb resolved by the current page
 const verb=Object.keys(VERBS).find(v=>VERBS[v].some(w=>s.includes(w)));
 if(verb&&screen.type==="page"){const cand=pageActions(screen.page).filter(id=>PROCS[id].verb===verb);if(cand.length===1)return{procs:cand,fromPage:true};if(cand.length>1)return{choose:cand}}
 return{};
}

 const miss=missing.length?`<div class="th"><b>${t("not_covered",{n:missing.length})}</b></div><ol class="tl">${missing.map((m,i)=>`<li class="${m.st==="out"?"out":""}"><span class="n">?</span><div><div class="s">${esc(lang==="de"?(m.title_de||m.title_en):m.title_en)}</div><div class="d">${m.st==="deriving"?t("deriving"):m.st==="failed"?t("derive_failed"):m.st==="out"?t("left_out"):esc(lang==="de"?(m.why_de||m.why_en||""):(m.why_en||""))}</div></div>${m.st==="open"&&!running?`<span class="actions"><button class="btn primary sm" data-inc="${i}">${t("include")}</button><button class="btn sm" data-out="${i}">${t("leave_out")}</button></span>`:m.st==="deriving"?`<span class="thinking"><i></i></span>`:""}</li>`).join("")}</ol>`:"";
 const act=ids.length===1?`<button class="btn primary sm" data-go="${ids[0]}">${t("start")}</button>`:ids.length>1?`<button class="btn primary sm" data-run>${t("start_n",{n:ids.length})}</button>`:"";
 el.innerHTML=`<div class="lead"><p>${lead}</p>${readBtn()}</div>${orderNote?`<div class="hint">${esc(orderNote)}</div>`:""}${ids.length||missing.length?`<div class="tasks">${ids.length?head+`<ol class="tl">${rows}</ol>`:""}${miss}${act?`<div class="tf"><span class="tstat" data-tstat>${!running&&open.some(m=>m.st==="open")?t("not_covered_b"):ids.length?t("start_hint"):""}</span><div class="actions" data-actions>${act}</div></div>`:""}</div>`:""}${lookupText&&!running?`<div class="foot"><span>${t("not_it")}</span><button data-lookup>${t("lookup")}</button><button data-hand>${t("a.handoff")}</button></div>`:""}`;
 wireRead(el);
 const rb=el.querySelector("[data-run]");if(rb)rb.onclick=()=>{for(const m of plan.missing)if(m.st==="open")m.st="out";renderPlan(plan);startCase(plan.ids,el)};
 const gb=el.querySelector("[data-go]");if(gb)gb.onclick=()=>startCase(ids,el);
 el.querySelectorAll("[data-inc]").forEach(b=>b.onclick=async()=>{const m=plan.missing[Number(b.dataset.inc)];m.st="deriving";renderPlan(plan);const id=await deriveProc(m.title_en+(lookupText?" — context: "+lookupText:""));if(id){plan.ids.push(id);plan.missing.splice(plan.missing.indexOf(m),1)}else m.st="failed";renderPlan(plan)});
 el.querySelectorAll("[data-out]").forEach(b=>b.onclick=()=>{plan.missing[Number(b.dataset.out)].st="out";renderPlan(plan)});
 const lk=el.querySelector("[data-lookup]");if(lk)lk.onclick=()=>liveLookup(lookupText);
 const hd=el.querySelector("[data-hand]");if(hd)hd.onclick=openHandoff;

 return showPlans(ids,{orderNote:ids.length>1&&first.why?t("order_note",{a:L(first.l),b:L(first.why)}):"",conf:r.fromPage?.7:.9,lookupText:text,fromPage:!!r.fromPage,into});

// ---------- 3. derivation: steps for a request the catalog does not cover ----------
let dynCount=0;
function lookupPrompt(q){
 const idx=Object.entries(SOURCES).map(([k,v])=>`${k}: ${v.t} — ${v.u}`).join("\n");
 return`You derive Austrian public-administration procedures for a citizen-account assistant. Reply with ONLY one JSON object, no prose.
Citizen request: ${JSON.stringify(q)}
Citizen profile (data the state already holds): ${JSON.stringify(profileSummary())}
Profile fields you may mark as already on file (kind "review"): ${Object.keys(F).join(", ")}
Categories (page): identity, passport, licence, ecard, residence, household, vehicle
Official sources you may cite, by id (cite ONLY these ids; never invent URLs):
${idx}
Rules: 4 to 7 steps in chronological order. The AGENT does the finding out: never write a step that tells the citizen to find, check, look up, ask or contact anyone for information. Step kinds:
- "review": data the state already holds (fields = names from the list above).
- "lookup": a fact the agent determines and states concretely in desc, one topic per step: the competent authority and how to apply, the deadline, the documents required, the fee. Only state what you are sure of from the sources or well-established rules. If a third party must supply it (a landlord, a hospital, an insurer), name it in party_en/party_de; the agent requests it and waits.
- "input": only facts the state cannot know (e.g. a chip number, a date, a choice); fields are objects with k, label_en, label_de, type text|date|select|file, and for select an "options" string "en|de;en|de".
- "external": only acts the citizen must perform in person (sign, appear, pay at a counter, hand over an item). Never information gathering. If instead another person confirms something (landlord, second parent, employer), set party_en/party_de and the agent requests it.
- "inquiry": when a requirement (documents, fee, deadline, office) cannot be determined reliably: to_en/to_de = the authority to ask, question_en/question_de = one precise question. The citizen approves sending it. Use this instead of guessing fees or deadlines.
- "confirm": exactly one, the submission; to_en/to_de = receiving authority; fee as text or "free".
- "info": what happens afterwards (last).
Also set "channel": "online" only if this can really be submitted online today (an online form or portal of the authority), "appointment" if the citizen must appear in person, "paper" otherwise.
Give each step a "source" id when one fits. Plain language (B1), both languages. confidence 0..1 says how well the listed sources cover the request. If the request is outside Austrian public administration, return {"error":"..."}.
Shape: {"title_en":"","title_de":"","desc_en":"","desc_de":"","page":"residence","channel":"online","confidence":0.8,"sources":["anmeldung"],"days":3,"steps":[{"kind":"review","title_en":"","title_de":"","desc_en":"","desc_de":"","fields":["name","born"],"source":"anmeldung"},{"kind":"lookup","title_en":"Competent authority and deadline","title_de":"","desc_en":"City of Vienna, MA 6 – within 14 days","desc_de":"","source":"behoerden"},{"kind":"input","title_en":"","title_de":"","desc_en":"","desc_de":"","fields":[{"k":"when","label_en":"When","label_de":"Wann","type":"date"}]},{"kind":"inquiry","title_en":"","title_de":"","desc_en":"","desc_de":"","to_en":"","to_de":"","question_en":"","question_de":""},{"kind":"external","title_en":"","title_de":"","desc_en":"","desc_de":"","party_en":"","party_de":""},{"kind":"confirm","title_en":"","title_de":"","desc_en":"","desc_de":"","to_en":"","to_de":"","fee":"free"},{"kind":"info","title_en":"","title_de":"","desc_en":"","desc_de":""}]}`;
}
function registerDyn(j){
 const id="dyn_"+(++dynCount);const pg=PAGES[j.page]?j.page:"identity";
 const steps=(j.steps||[]).map(s=>{const l=(s.title_en||"")+"|"+(s.title_de||s.title_en||"");const d=(s.desc_en||"")+"|"+(s.desc_de||s.desc_en||"");const page=PAGES[s.page]?s.page:pg;const party=s.party_en?String(s.party_en)+"|"+String(s.party_de||s.party_en):undefined;let st;
  if(s.kind==="review")st=R(page,l,d,(Array.isArray(s.fields)?s.fields:[]).filter(k=>typeof k==="string"&&F[k]).slice(0,6));
  else if(s.kind==="input")st=I(page,l,d,(Array.isArray(s.fields)?s.fields:[]).filter(fd=>fd&&typeof fd==="object"&&fd.k).slice(0,5).map(fd=>f(String(fd.k).replace(/\W/g,"_"),(fd.label_en||fd.k)+"|"+(fd.label_de||fd.label_en||fd.k),{t:["text","date","select","file"].includes(fd.type)?fd.type:"text",opt:fd.type==="select"?String(fd.options||"Yes|Ja;No|Nein"):undefined,req:fd.type!=="file"})));
  else if(s.kind==="confirm")st=C(page,l,d,(s.to_en||"Responsible authority")+"|"+(s.to_de||s.to_en||"Zuständige Behörde"),s.fee&&String(s.fee).toLowerCase()!=="free"?String(s.fee):undefined);
  else if(s.kind==="info")st=N(page,l,d,[]);
  else if(s.kind==="lookup")st=K(page,l,d,PAGE_IFACE[page]||"ZPR",party);
  else if(s.kind==="inquiry")st=Q(page,l,d||"",(s.to_en||"Responsible authority")+"|"+(s.to_de||s.to_en||"Zuständige Behörde"),(s.question_en||s.title_en||"")+"|"+(s.question_de||s.question_en||s.title_de||""));
  else st=X(page,l,d,party);
  if(s.source&&SOURCES[s.source])st.src=[s.source];return st}).slice(0,7);
 if(steps.filter(s=>s.k==="review").length===0)steps.unshift(R(pg,"Your data on file|Ihre hinterlegten Daten","Nothing to type.|Nichts zu tippen.",["name","born","citizen"]));
 if(!steps.some(s=>s.k==="confirm"))steps.push(C(pg,"Confirm and submit|Bestätigen und einreichen","","Responsible authority|Zuständige Behörde"));
 PROCS[id]={page:pg,l:(j.title_en||"Procedure")+"|"+(j.title_de||j.title_en||"Verfahren"),d:(j.desc_en||"")+"|"+(j.desc_de||j.desc_en||""),verb:"new",kw:[],days:Number(j.days)||0,steps,src:(Array.isArray(j.sources)?j.sources:[]).filter(i=>SOURCES[i]).slice(0,4),dyn:true,conf:Math.max(0,Math.min(1,Number(j.confidence)||0)),ch:j.channel==="appointment"?"appt":j.channel==="paper"?"paper":"online"};
 PAGES[pg].actions.push(id);return id;
}
async function deriveProc(q){
 const t0=Date.now();let j=null;
 try{
  if(API_BASE){const r=await fetch(API_BASE+"/lookup",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({query:q,lang,profile:profileSummary(),sources:SOURCES})});if(!r.ok)throw{code:"upstream_error"};j=await r.json()}
  else j=await llmJson(lookupPrompt(q),{tier:TIER_DERIVE});
 }catch(e){j=null}
 logEvent({path:"derive",input:q,ok:!!(j&&Array.isArray(j.steps)&&j.steps.length),confidence:j&&j.confidence!=null?Number(j.confidence):null,ms:Date.now()-t0,mode:API_BASE?"fetched pages":"model knowledge + index"});
 if(!j||j.error||!Array.isArray(j.steps)||!j.steps.length)return null;
 if(j.new_sources&&typeof j.new_sources==="object")for(const [k,v] of Object.entries(j.new_sources))if(v&&typeof v.u==="string"&&/^https:\/\/([a-z0-9-]+\.)*(gv\.at|fsw\.at|sozialministeriumservice\.at)\//.test(v.u))SOURCES[k]={t:String(v.t||v.u),u:v.u};
 return registerDyn(j);
}
async function liveLookup(q){
 const {el}=thinking(t("thinking"));
 const id=await deriveProc(q);
 if(!id){el.innerHTML=`<div class="lead"><p>${t("lookup_fail")}</p></div>${srcBlock(["formsearch","behoerden"])}<div class="actions"><button class="btn" data-hand>${t("a.handoff")}</button></div>`;el.querySelector("[data-hand]").onclick=openHandoff;return}
 showPlans([id],{summary:`${t("understood")}: ${L(PROCS[id].l)}. ${L(PROCS[id].d)}`,conf:PROCS[id].conf,into:el});
}

function askStatus(ref){const q=requests.find(x=>x.ref===ref);if(!q)return;add(`<div class="you">${t("status_q")}: ${q.ref}</div>`);add(`<div class="msg"><div class="lead"><p>${t("status_a",{p:"<b>"+q.title+"</b>",d:rel(q.date),ref:q.ref,days:PROCS[q.proc].days||1})}</p>${readBtn()}</div></div>`)}

function summaryText(){if(cb&&!cb.complete)return cb.file.id+" · "+caseTitle()+" · "+t("prog_line",{k:doneCount(),n:visibleIds().length});return screen.type==="page"?t("looking")+": "+L(PAGES[screen.page].l):t("h_none")}
function openHandoff(){
 const p=profile;const when=I18N[lang].h_when_o;
 const el=add(`<div class="msg"><div class="lead"><p><b>${t("h_title")}</b><br><span class="hint">${t("h_sub")}</span></p></div>
  <form class="form" id="hform"><label>${t("h_how")}<select id="h_how"><option value="call">${t("h_call")}</option><option value="appt">${t("h_appt")}</option><option value="video">${t("h_video")}</option></select></label>
  <label>${t("h_phone")}<input id="h_phone" value="${esc(p.phone||"")}"></label>

 const fm=el.querySelector("#hform");el.querySelector("#h_cancel").onclick=()=>el.remove();

function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),2200)}

// ---------- wiring ----------
function renderStatic(){
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 $("#q").placeholder=t("placeholder");$("#thread").dataset.empty=t("a.sub");
 const sel=$("#persona");sel.innerHTML=Object.entries(PERSONAS).map(([k,p])=>`<option value="${k}">${p.name}</option>`).join("");sel.value=personaKey;
 $("#lang-de").setAttribute("aria-pressed",lang==="de");$("#lang-en").setAttribute("aria-pressed",lang==="en");document.documentElement.lang=lang;

function loadPersona(k){personaKey=k;profile=JSON.parse(JSON.stringify(PERSONAS[k]));requests=[];pastCases=[];caseData={};convo=[];clarifyCount=0;followShown=false;pending=null;cb=null;screen={type:"overview"};$("#thread").innerHTML=""}
// ---------- voice input: the browser's speech recognition (Chrome, Edge, Safari); the transcript shows while you speak, a second tap sends ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let rec=null;
function voiceUi(on){const mic=$("#mic");mic.classList.toggle("rec",on);mic.setAttribute("aria-pressed",String(on));$("#voice").hidden=!on;if(on){$("#voicetext").textContent=t("voice_hint");$("#q").placeholder=t("listening")}else updatePlaceholder()}
function startVoice(){
 if(!SR){toast(t("voice_unsupported"));return}
 if(rec){try{rec.stop()}catch(e){}return}
 const r=new SR();rec=r;r.lang=lang==="de"?"de-AT":"en-GB";r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
 const q=$("#q");let finalText="",heard=false,failed=false;q.value="";voiceUi(true);
 r.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const tr=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=tr;else interim+=tr}q.value=(finalText+" "+interim).replace(/\s+/g," ").trim();heard=!!q.value};
 r.onerror=e=>{const c=e.error||"";failed=c!=="aborted"&&c!=="no-speech";const msg=c==="not-allowed"||c==="service-not-allowed"?t("voice_blocked"):c==="no-speech"?t("voice_nospeech"):c==="network"?t("voice_network"):c==="audio-capture"?t("voice_nomic"):c==="aborted"?"":t("voice_unavail");if(msg)toast(msg);logEvent({path:"voice",error:c})};
 r.onend=()=>{rec=null;voiceUi(false);const text=q.value.trim();if(text&&heard&&!failed){logEvent({path:"voice",input:text,lang:r.lang});askText(text)}else if(text)q.focus()};
 try{r.start()}catch(e){rec=null;voiceUi(false);toast(t("voice_unavail"))}
}
$("#mic").onclick=startVoice;
$("#mic").classList.toggle("off",!SR);$("#mic").title=SR?t("voice_title"):t("voice_unsupported");
$("#askform").onsubmit=e=>{e.preventDefault();askText($("#q").value)};

$("#newchat").onclick=()=>{$("#thread").innerHTML="";convo=[];clarifyCount=0;followShown=false;pending=null;$("#q").focus()};
$("#newchat").title=t("newchat");
$("#persona").onchange=e=>{loadPersona(e.target.value);render();toast(t("toast_persona"))};
$("#lang-de").onclick=()=>setLang("de");$("#lang-en").onclick=()=>setLang("en");
function setLang(l){if(l===lang)return;lang=l;$("#thread").innerHTML="";convo=[];clarifyCount=0;followShown=false;pending=null;renderStatic();render();toast(t("toast_lang"))}
$("#simple").onclick=()=>{simple=!simple;$("#simple").setAttribute("aria-pressed",simple);document.body.classList.toggle("simple",simple)};

loadPersona("lena");renderStatic();render();
</script>
